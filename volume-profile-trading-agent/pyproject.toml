[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-profile-trading-agent"
version = "0.2.2"
description = "Research and paper-trading Volume Profile agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]
crypto = ["ccxt>=4.4"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
plot = ["matplotlib>=3.8"]

[project.scripts]
vp-agent = "volume_profile_agent.cli:main"
vp-export-ccxt = "volume_profile_agent.ccxt_feed:main"
vp-mt5-paper = "volume_profile_agent.mt5_paper_runner:main"
vp-mt5-check = "volume_profile_agent.mt5_diagnostics:main"

[tool.setuptools.packages.find]
include = ["volume_profile_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
